<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Noctua project architecture and validation status</title>
<desc id="desc">Diagram of the camera, Raspberry Pi, planned storage, connectivity and power, and pending validation steps.</desc>
<rect width="1100" height="650" fill="#f8fafc"/>
<text x="550" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#16324a">NOCTUA — AUTONOMOUS WILDLIFE CAMERA</text>
<text x="550" y="85" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">Test-bench progress · October 2026 · Not yet field-deployed</text>
<g font-family="Arial,sans-serif">
<rect x="60" y="145" width="300" height="160" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="210" y="180" font-size="21" font-weight="bold" text-anchor="middle" fill="#075985">UMBRA · Camera</text>
<text x="85" y="215" font-size="16" fill="#164e63">Reolink RLC-811A</text>
<text x="85" y="242" font-size="15" fill="#164e63">H.264 substream · 640 × 360</text>
<text x="85" y="269" font-size="15" fill="#164e63">H.265 main stream · 4K</text>
<rect x="400" y="145" width="300" height="160" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="550" y="180" font-size="21" font-weight="bold" text-anchor="middle" fill="#166534">NOCTUA · Raspberry Pi 5</text>
<text x="425" y="215" font-size="16" fill="#14532d">Linux · SSH · Python</text>
<text x="425" y="242" font-size="15" fill="#14532d">RTSP / FFmpeg tested</text>
<text x="425" y="269" font-size="15" fill="#14532d">CPU and RAM measured</text>
<rect x="740" y="145" width="300" height="160" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="890" y="180" font-size="21" font-weight="bold" text-anchor="middle" fill="#92400e">FIELD SYSTEM · Planned</text>
<text x="765" y="215" font-size="16" fill="#78350f">SSD local storage</text>
<text x="765" y="242" font-size="15" fill="#78350f">4G / secure remote access</text>
<text x="765" y="269" font-size="15" fill="#78350f">Battery + solar + MPPT</text>
<path d="M360 225 H400 M700 225 H740" stroke="#475569" stroke-width="3" fill="none"/>
<path d="M390 217 L400 225 L390 233 M730 217 L740 225 L730 233" stroke="#475569" stroke-width="3" fill="none"/>
<rect x="60" y="360" width="980" height="205" rx="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="85" y="398" font-size="22" font-weight="bold" fill="#16324a">Validation still required</text>
<text x="85" y="438" font-size="17" fill="#334155">• Confirm exact PoE wiring and electrical compatibility</text>
<text x="85" y="472" font-size="17" fill="#334155">• Test recording integrity, timestamps, network and restart recovery</text>
<text x="85" y="506" font-size="17" fill="#334155">• Measure day/night power draw, then complete the 72-hour test</text>
<text x="85" y="540" font-size="17" fill="#334155">• Size off-grid power only after measured results</text>
<text x="550" y="610" font-size="17" text-anchor="middle" fill="#475569">Observe → Test → Measure → Document → Improve</text>
</g>
</svg>