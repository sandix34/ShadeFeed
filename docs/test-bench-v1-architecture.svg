<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc">
<title id="title">Noctua V1 test-bench power and network concept</title>
<desc id="desc">English conceptual diagram of the proposed test bench. The historic 12 volt distribution is unverified. A 24 volt power supply was used in camera tests; no final electrical wiring is approved.</desc>
<rect width="1100" height="730" fill="#f8fafc"/>
<g font-family="Arial, sans-serif">
<text x="550" y="52" text-anchor="middle" font-size="29" font-weight="bold" fill="#0f172a">NOCTUA — V1 TEST-BENCH CONCEPT</text>
<text x="550" y="82" text-anchor="middle" font-size="16" fill="#475569">English reference diagram · October 2026 · Not an electrical wiring instruction</text>
<rect x="55" y="108" width="990" height="86" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="77" y="137" font-size="19" font-weight="bold" fill="#991b1b">WARNING — POWER ARCHITECTURE NOT VALIDATED</text>
<text x="77" y="161" font-size="15" fill="#7f1d1d">Historical design proposed 12 V distribution. Recent camera tests used a nominal 24 V supply.</text>
<text x="77" y="182" font-size="15" fill="#7f1d1d">Verify injector input, polarity, connectors and power conversions before connecting hardware.</text>
<rect x="65" y="243" width="280" height="150" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="205" y="276" font-size="21" font-weight="bold" text-anchor="middle" fill="#075985">Camera branch</text>
<text x="85" y="309" font-size="16" fill="#164e63">PLANET IPOE-162 injector</text>
<text x="85" y="338" font-size="16" fill="#164e63">Reolink RLC-811A (Umbra)</text>
<text x="85" y="366" font-size="15" fill="#164e63">PoE + Ethernet</text>
<rect x="410" y="243" width="280" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="550" y="276" font-size="21" font-weight="bold" text-anchor="middle" fill="#166534">Compute branch</text>
<text x="430" y="309" font-size="16" fill="#14532d">Raspberry Pi 5 (Noctua)</text>
<text x="430" y="338" font-size="16" fill="#14532d">USB 3 SSD (planned)</text>
<text x="430" y="366" font-size="15" fill="#14532d">Regulated supply required</text>
<rect x="755" y="243" width="280" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="895" y="276" font-size="21" font-weight="bold" text-anchor="middle" fill="#92400e">Network branch</text>
<text x="775" y="309" font-size="16" fill="#78350f">Teltonika RUT241 (planned)</text>
<text x="775" y="338" font-size="16" fill="#78350f">Cellular 4G connection</text>
<text x="775" y="366" font-size="15" fill="#78350f">Secure remote access pending</text>
<rect x="65" y="447" width="970" height="95" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="550" y="476" text-anchor="middle" font-size="21" font-weight="bold" fill="#334155">POWER DISTRIBUTION — TO BE DESIGNED AND VERIFIED</text>
<text x="550" y="503" text-anchor="middle" font-size="16" fill="#334155">Battery / solar / MPPT · conversion · branch protection · safe measurement points</text>
<text x="550" y="525" text-anchor="middle" font-size="15" fill="#475569">No validated voltage bus, fuses, wire gauges or final connection scheme</text>
<path d="M205 447 V412 M550 447 V412 M895 447 V412" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
<text x="550" y="586" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Proposed measurement plan</text>
<text x="550" y="615" text-anchor="middle" font-size="16" fill="#334155">M1: total system · M2: camera / PoE · M3: Raspberry Pi / SSD · M4: cellular router</text>
<text x="550" y="649" text-anchor="middle" font-size="16" fill="#334155">Next: confirm wiring → measure power → validate recording → run the 72-hour test</text>
<text x="550" y="696" text-anchor="middle" font-size="15" fill="#475569">Conceptual functional relationships only — dashed lines do not specify electrical connections.</text>
</g>
</svg>